name: "Continuous Integration"

# TODO: Add cache action for mise and godot export templates.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5.1"
  EXPORT_NAME: "void"

permissions:
  checks: write
  contents: read

jobs:
  # Always run these jobs
  lint-and-format:
    name: Lint and Format GDScript
    runs-on: ubuntu-24.04
    # We don't care about linting on release tags
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

  test:
    name: Test Game
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: MikeSchulze/gdunit4-action@17eeffa988f9732fdc3dba3067405d16b55809de # v1.3.2
        with:
          godot-version: ${{env.GODOT_VERSION}}
          paths: "res://test"
          warnings-as-errors: true
          arguments: "--verbose"
# EOF
