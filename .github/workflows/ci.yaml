name: "Continuous Integration"

# TODO: Add cache action for mise and godot export templates.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5.1"
  EXPORT_NAME: "void"

permissions:
  checks: write
  contents: read

jobs:
  # Always run these jobs
  lint-and-format:
    name: Lint and Format GDScript
    runs-on: ubuntu-24.04
    # We don't care about linting on release tags
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Trunk Code Quality
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  test:
    name: Test Game
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: MikeSchulze/gdunit4-action@17eeffa988f9732fdc3dba3067405d16b55809de # v1.3.2
        with:
          godot-version: ${{env.GODOT_VERSION}}
          paths: "res://test"
          warnings-as-errors: true
          arguments: "--verbose"
# EOF
